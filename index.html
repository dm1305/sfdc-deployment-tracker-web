<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>SFDC Deployment Tracker (Web)</title>
  <link rel="stylesheet" href="./styles.css?v=2026-02-10.2">
</head>
<body>
  <header class="bar">
    <h1>SFDC Deployment Tracker (Web)</h1>
    <div class="actions">
      <button id="loginBtn">Login</button>
      <button id="logoutBtn">Logout</button>
      <span id="statusPill">Not connected</span>
    </div>
  </header>

  <main>
    <section class="panel">
      <h2>Deployments</h2>
      <button id="refreshBtn">Refresh</button>
      <table>
        <thead>
          <tr><th>Status</th><th>Type</th><th>Created</th><th>Id</th></tr>
        </thead>
        <tbody id="deploymentsTbody">
          <tr><td colspan="4" class="muted">Not loaded.</td></tr>
        </tbody>
      </table>
    </section>

    <section class="panel">
      <h2>Log</h2>
      <pre id="logPre"></pre>
    </section>
  </main>

  <script src="./auth.js?v=2026-02-10.2" defer></script>
  <script src="./app.js?v=2026-02-10.2" defer></script>
</body>
</html>
