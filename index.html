<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Salesforce Deployment & Test Monitor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      margin: 24px;
      background: #f7f8fa;
      color: #111;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 22px;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    button {
      padding: 6px 10px;
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #f0f0f0;
    }

    .pill {
      padding: 4px 8px;
      border-radius: 999px;
      background: #e5e7eb;
      font-size: 12px;
    }

    .tabs {
      display: flex;
      gap: 6px;
      margin: 16px 0 8px;
    }

    .tab {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      background: #fff;
      cursor: pointer;
      font-size: 14px;
    }

    .tab:hover {
      background: #f0f0f0;
    }

    .panel {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      border-bottom: 1px solid #eee;
      padding: 6px 8px;
      text-align: left;
      white-space: nowrap;
    }

    th {
      background: #fafafa;
      font-weight: 600;
    }

    pre {
      background: #0f172a;
      color: #e5e7eb;
      padding: 12px;
      border-radius: 8px;
      overflow: auto;
      font-size: 12px;
      margin: 0;
    }

    .footer {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 900px) {
      .footer {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <h1>Salesforce Deployment & Apex Test Monitor</h1>

  <div class="topbar">
    <button id="loginBtn">Login</button>
    <button id="logoutBtn">Logout</button>
    <span class="pill" id="orgPill">Not connected</span>
    <span class="pill" id="apiPill">—</span>
  </div>

  <div class="tabs">
    <button class="tab" id="tabDeployments">Deployments</button>
    <button class="tab" id="tabTests">Apex Tests</button>
  </div>

  <!-- Deployments -->
  <div class="panel" id="deploymentsPanel">
    <h3>Deployments</h3>
    <table>
      <thead>
        <tr>
          <th>Status</th>
          <th>User</th>
          <th>Type</th>
          <th>Created</th>
          <th>Started</th>
          <th>Completed</th>
          <th>Queue</th>
          <th>Run</th>
          <th>Total</th>
          <th>Id</th>
        </tr>
      </thead>
      <tbody id="deploymentsTbody">
        <tr><td colspan="10">No data loaded.</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Apex Tests -->
  <div class="panel" id="testsPanel" style="display:none">
    <h3>Apex Test Runs</h3>
    <table>
      <thead>
        <tr>
          <th>Status</th>
          <th>User</th>
          <th>Started</th>
          <th>Completed</th>
          <th>Duration</th>
          <th>Methods Passed</th>
          <th>Methods Failed</th>
          <th>Run Id</th>
        </tr>
      </thead>
      <tbody id="testsTbody">
        <tr><td colspan="8">No data loaded.</td></tr>
      </tbody>
    </table>
  </div>

  <div class="footer">
    <div class="panel">
      <h3>Selected / Status</h3>
      <pre id="statusPre">Ready.</pre>
    </div>
    <div class="panel">
      <h3>Log</h3>
      <pre id="logPre"></pre>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
