<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SFDC Deployment Tracker (Web)</title>
  <meta name="color-scheme" content="dark light" />

  <style>
    :root{
      --bg:#0b1220; --border:rgba(255,255,255,.10);
      --text:rgba(255,255,255,.92); --muted:rgba(255,255,255,.62);
      --good:#2ecc71; --warn:#f39c12; --bad:#e74c3c;
      --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
      --sans:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      --radius:12px;
    }
    *{box-sizing:border-box;}
    body{
      margin:0; font-family:var(--sans);
      background:radial-gradient(1200px 700px at 20% -10%, rgba(73,127,255,.18), transparent 55%),
                 radial-gradient(1000px 600px at 85% 0%, rgba(46,204,113,.14), transparent 55%),
                 var(--bg);
      color:var(--text);
    }
    .app{padding:18px;max-width:1600px;margin:0 auto;}
    .topbar{
      display:flex;justify-content:space-between;align-items:center;gap:12px;
      padding:14px;border:1px solid var(--border);
      background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.03));
      border-radius:var(--radius);backdrop-filter:blur(10px);
    }
    .title{display:flex;flex-direction:column;gap:6px;}
    .title h1{margin:0;font-size:18px;}
    .pills{display:flex;gap:8px;flex-wrap:wrap;}
    .pill{
      display:inline-flex;gap:6px;align-items:center;
      padding:6px 10px;border-radius:999px;
      border:1px solid var(--border);background:rgba(0,0,0,.18);
      font-size:12px;color:var(--muted);
    }
    .pill code{font-family:var(--mono);color:var(--text);}
    .actions{display:flex;gap:8px;flex-wrap:wrap;}
    button,select{
      border:1px solid var(--border);
      background:rgba(255,255,255,.06);
      color:var(--text);
      padding:9px 12px;border-radius:10px;
      font-size:13px;
    }
    button:hover{background:rgba(255,255,255,.10);cursor:pointer;}
    select{background:rgba(0,0,0,.18);}
  </style>
</head>

<body>
<div class="app">
  <div class="topbar">
    <div class="title">
      <h1>SFDC Deployment Tracker (Web)</h1>
      <div class="pills">
        <div class="pill">Org: <code id="orgPill">—</code></div>
        <div class="pill">API: <code id="apiPill">—</code></div>
        <div class="pill">Build: <code id="buildPill">2026-02-08.1</code></div>
      </div>
    </div>

    <div class="actions">
      <select id="apiVersionSelect" title="API version">
        <option value="65.0">v65.0</option>
        <option value="64.0">v64.0</option>
        <option value="63.0">v63.0</option>
        <option value="62.0">v62.0</option>
      </select>

      <a href="./inventory.html"><button>Inventory</button></a>
      <button id="loginBtn">Login</button>
      <button id="logoutBtn">Logout</button>
      <button id="refreshBtn">Refresh</button>
      <button id="clearStorageBtn">Clear storage</button>
    </div>
  </div>

  <div style="margin-top:14px;">
    <pre id="logPre"
      style="min-height:200px;font-family:var(--mono);
             background:rgba(0,0,0,.25);padding:12px;
             border-radius:12px;border:1px solid rgba(255,255,255,.08);">
Ready.
    </pre>
  </div>
</div>

<script src="./app.js"></script>
</body>
</html>
