<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SFDC Deployment Tracker (Web)</title>

  <style>
    :root {
      --bg: #0b0c10;
      --panel: #12141a;
      --panel2: #0f1117;
      --text: #e8eaf0;
      --muted: #a9afbf;
      --border: #262a36;
      --accent: #6ea8fe;
      --good: #3ddc97;
      --warn: #ffcc66;
      --bad:  #ff6b6b;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      margin: 18px;
    }

    h1 { margin: 0 0 10px; font-size: 20px; }
    h2 { margin: 0 0 10px; font-size: 14px; color: var(--muted); font-weight: 600; letter-spacing: .2px; }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .pill {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      color: var(--muted);
      display: inline-flex;
      gap: 8px;
      align-items: center;
    }

    .btn {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
    }
    .btn:hover { border-color: #3a4060; }
    .btn.primary { border-color: #2f5fb9; background: #11203d; }
    .btn.danger { border-color: #7a2b2b; background: #2a1111; }

    .tabs {
      display: flex;
      gap: 8px;
      margin: 10px 0 12px;
    }
    .tab {
      border: 1px solid var(--border);
      background: var(--panel2);
      color: var(--muted);
      padding: 8px 10px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
    }
    .tab.active {
      color: var(--text);
      border-color: #3a4060;
      background: var(--panel);
    }

    .layout {
      display: grid;
      grid-template-columns: 1.6fr 1fr;
      gap: 12px;
    }
    @media (max-width: 1050px) {
      .layout { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin: 10px 0;
    }

    label {
      font-size: 12px;
      color: var(--muted);
      display: inline-flex;
      gap: 8px;
      align-items: center;
    }

    input, select {
      background: #0f1220;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 13px;
      outline: none;
    }
    input::placeholder { color: #6b7186; }

    .tableWrap { overflow: auto; border-radius: 12px; border: 1px solid var(--border); }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
      background: #0f1117;
    }
    th, td {
      padding: 10px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      text-align: left;
      vertical-align: top;
      white-space: nowrap;
    }
    th { color: var(--muted); font-weight: 600; background: #0c0e15; position: sticky; top: 0; z-index: 1; }
    td.small { color: var(--muted); font-size: 12px; white-space: normal; }
    .status { font-weight: 700; }
    .status.good { color: var(--good); }
    .status.warn { color: var(--warn); }
    .status.bad  { color: var(--bad); }
