<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SFDC Deployment Tracker</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; margin: 24px; }
    h1 { margin-bottom: 8px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    button { padding: 6px 12px; cursor: pointer; }
    table { border-collapse: collapse; width: 100%; margin-top: 12px; }
    th, td { border: 1px solid #ccc; padding: 6px; font-size: 13px; }
    th { background: #f5f5f5; }
    .mono { font-family: monospace; }
    pre { background: #111; color: #eee; padding: 12px; border-radius: 6px; overflow: auto; }
  </style>
</head>
<body>

<h1>SFDC Deployment Tracker</h1>

<div class="row">
  <button id="loginBtn">Login</button>
  <button id="logoutBtn">Logout</button>
  <button id="refreshBtn">Refresh Deployments</button>
</div>

<table>
  <thead>
    <tr>
      <th>Status</th>
      <th>User</th>
      <th>Type</th>
      <th>Created</th>
      <th>Started</th>
      <th>Completed</th>
    </tr>
  </thead>
  <tbody id="deploymentsTbody">
    <tr><td colspan="6">Not loaded</td></tr>
  </tbody>
</table>

<h3>Log</h3>
<pre id="logPre">Ready.</pre>

<script src="app.js"></script>
</body>
</html>
