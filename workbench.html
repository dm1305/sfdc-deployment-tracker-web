<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Workbench Tester</title>
  <meta name="color-scheme" content="dark light" />
  <link rel="stylesheet" href="./P26-02-10.1" />
</head>

<body>
  <div class="app">

    <!-- TOP BAR -->
    <div class="topbar">
      <div class="title">
        <h1>Workbench Tester</h1>
        <div class="pills">
          <div class="pill">Org: <code id="orgPill">Not connected</code></div>
          <div class="pill">Instance: <code id="instancePill">—</code></div>
          <div class="pill">Org Id: <code id="orgIdPill">—</code></div>
          <div class="pill">User: <code id="userPill">—</code></div>
          <div class="pill">API: <code id="apiPill">—</code></div>
          <div class="pill">API max: <code id="apiMaxPill">—</code></div>
          <div class="pill">Build: <code id="buildPill">—</code></div>
        </div>
      </div>

      <div class="actions">
        <select id="apiVersionSelect" title="API version"></select>
        <button id="loginBtn">Login</button>
        <button id="logoutBtn">Logout</button>
        <a class="tab" href="./index.html">Deployments</a>
        <a class="tab" href="./inventory.html">Metadata inventory</a>
        <button id="orgDetailsBtn">Org details</button>
        <button id="errorsBtn">Errors: <span id="errorCount">0</span></button>
      </div>
    </div>

    <div id="authBanner" class="banner"></div>

    <!-- CONTROLS -->
    <div class="controls">
      <span class="label">Proxy URL</span>
      <input id="proxyUrl" placeholder="https://your-worker.yourdomain.workers.dev" style="min-width:420px;" />

      <span class="label">Action</span>
      <select id="wbAction">
        <option value="list" selected>List metadata (listMetadata)</option>
        <option value="retrieve">Retrieve (benchmark)</option>
      </select>

      <span class="label">Type</span>
      <input id="mdType" placeholder="e.g. Flow, ApexClass, Layout" style="min-width:220px;" />

      <span class="label">Members</span>
      <input id="mdMembers" placeholder="comma-separated or *" style="min-width:260px;" />

      <button id="runBtn">Run</button>
      <button id="downloadBtn" disabled>Download ZIP</button>

      <div class="progressWrap" style="margin-left:auto; display:flex; gap:10px; align-items:center;">
        <span class="muted small" id="timerLabel">Timer: 0.0s</span>
        <span class="badge" id="busyPill">Idle</span>
      </div>
    </div>

    <!-- LAYOUT -->
    <div class="layout">
      <div class="card">
        <div class="cardHeader">
          <div class="h">Output</div>
          <div class="meta">
            <span id="lastRequest" class="muted">Last request: —</span>
          </div>
        </div>
        <div class="cardBody">
          <pre id="outputPre" class="rightPre" style="min-height: 560px;">Ready.</pre>
        </div>
      </div>

      <div class="card">
        <div class="cardHeader">
          <div class="h">Log</div>
          <div class="meta"></div>
        </div>
        <div class="cardBody">
          <pre id="logPre" class="rightPre">Ready.</pre>
        </div>
      </div>
    </div>

    <!-- DRAWERS -->
    <div id="orgDetailsDrawer" class="drawer">
      <h3>Org details</h3>
      <pre id="orgDetailsPre">Loading…</pre>
      <div class="row">
        <a id="trustSearchLink" target="_blank">Trust (search)</a>
        <a id="trustInstanceLink" target="_blank">Trust (instance)</a>
        <button id="refreshOrgDetailsBtn">Refresh</button>
        <button class="closeDrawer">Close</button>
      </div>
    </div>

    <div id="errorsDrawer" class="drawer">
      <h3>Errors</h3>
      <pre id="errorsPre">No errors.</pre>
      <div class="row">
        <button id="clearErrorsBtn">Clear</button>
        <button class="closeDrawer">Close</button>
      </div>
    </div>

  </div>

  <script src="./P26-02-10.1"></script>
  <script src="./P26-02-10.1"></script>
</body>
</html>
