<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SFDC Metadata Inventory</title>
  <meta name="color-scheme" content="dark light" />

  <style>
    :root{
      --bg: #0b1220;
      --border: rgba(255,255,255,.10);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.62);
      --good: #2ecc71;
      --warn: #f39c12;
      --bad:  #e74c3c;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      --radius: 12px;
    }

    *{ box-sizing: border-box; }
    body{
      margin: 0;
      font-family: var(--sans);
      background: radial-gradient(1200px 700px at 20% -10%, rgba(73,127,255,.18), transparent 55%),
                  radial-gradient(1000px 600px at 85% 0%, rgba(46, 204, 113,.14), transparent 55%),
                  var(--bg);
      color: var(--text);
    }

    .app{
      padding: 18px 18px 26px;
      max-width: 1600px;
      margin: 0 auto;
    }

    .topbar{
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      padding: 14px 14px;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border-radius: var(--radius);
      backdrop-filter: blur(10px);
    }

    .title{
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 280px;
    }
    .title h1{
      font-size: 18px;
      margin: 0;
      letter-spacing: .2px;
    }

    .actions{
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    button, select, input{
      border: 1px solid var(--border);
      background: rgba(255,255,255,.06);
      color: var(--text);
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 13px;
      outline: none;
    }
    button:hover{ background: rgba(255,255,255,.10); cursor: pointer; }
    button:disabled{ opacity: .55; cursor: not-allowed; }
    select, input{ background: rgba(0,0,0,.18); }

    .controls{
      margin-top: 14px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.04);
      border-radius: var(--radius);
      padding: 12px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .label{ color: var(--muted); font-size: 13px; margin-right: 4px; }

    .card{
      margin-top: 14px;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
      border-radius: var(--radius);
      overflow: hidden;
    }

    .cardHeader{
      padding: 12px 12px;
      display: flex;
      gap: 10px;
      align-items: baseline;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .cardHeader .h{
      font-size: 14px;
      color: var(--text);
      font-weight: 600;
    }
    .cardHeader .meta{
      color: var(--muted);
      font-size: 12px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    table{
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td{
      border-bottom: 1px solid rgba(255,255,255,.08);
      padding: 10px 8px;
      vertical-align: top;
    }
    th{
      text-align: left;
      color: var(--muted);
      font-weight: 600;
      font-size: 12px;
      letter-spacing: .2px;
      position: sticky;
      top: 0;
      background: rgba(12,21,39,.92);
      backdrop-filter: blur(10px);
      z-index: 1;
    }

    .mono{ font-family: var(--mono); }
    .muted{ color: var(--muted); }
    .small{ font-size: 12px; }

    .banner{
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(231, 76, 60, .45);
      background: rgba(231, 76, 60, .12);
      display: none;
      color: rgba(255,255,255,.92);
    }

    .pre{
      font-family: var(--mono);
      font-size: 12px;
      background: rgba(0,0,0,.25);
      border: 1px solid rgba(255,255,255,.08);
      padding: 10px;
      border-radius: 12px;
      white-space: pre-wrap;
      overflow: auto;
      max-height: 240px;
      margin: 12px;
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="topbar">
      <div class="title">
        <h1>Metadata Inventory</h1>
        <div class="muted small">Tooling API-backed metadata report (best-effort coverage)</div>
      </div>
      <div class="actions">
        <a href="./index.html" style="text-decoration:none;"><button>Back</button></a>
        <button id="scanBtn">Scan</button>
        <button id="exportBtn">Export CSV</button>
      </div>
    </div>

    <div id="banner" class="banner"></div>

    <div class="controls">
      <span class="label">Changed since</span>
      <input id="sinceDt" type="datetime-local" />

      <span class="label">Type</span>
      <select id="typeFilter">
        <option value="all" selected>All</option>
      </select>

      <input id="search" placeholder="Search api name / type / user / id…" style="min-width: 360px;" />
      <span class="muted small" id="stats">0 rows</span>
    </div>

    <div class="card">
      <div class="cardHeader">
        <div class="h">Results</div>
        <div class="meta">
          <span id="lastRun" class="muted">Last run: —</span>
          <span id="busy" class="muted">Idle</span>
        </div>
      </div>
      <div style="max-height: 720px; overflow:auto;">
        <table>
          <thead>
            <tr>
              <th>Metadata type</th>
              <th>API name</th>
              <th>Last modified</th>
              <th>Last modified by</th>
              <th>Created</th>
              <th>Created by</th>
              <th>Id</th>
              <th>Extra</th>
            </tr>
          </thead>
          <tbody id="tbody">
            <tr><td colspan="8" class="muted small">Not scanned yet.</td></tr>
          </tbody>
        </table>
      </div>
      <pre id="log" class="pre">Ready.</pre>
    </div>
  </div>

  <script src="./inventory.js"></script>
</body>
</html>
