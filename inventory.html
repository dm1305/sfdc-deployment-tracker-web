<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Metadata Inventory</title>
  <meta name="color-scheme" content="dark light" />
  <style>
    body{margin:0;font-family:system-ui;background:#0b1220;color:#fff;}
    .app{padding:18px;max-width:1600px;margin:auto;}
    .topbar{display:flex;justify-content:space-between;gap:12px;
      padding:14px;border:1px solid rgba(255,255,255,.1);border-radius:12px;}
    button,select,input{padding:8px;border-radius:8px;}
    table{width:100%;border-collapse:collapse;margin-top:14px;}
    th,td{border-bottom:1px solid rgba(255,255,255,.1);padding:8px;}
  </style>
</head>

<body>
<div class="app">
  <div class="topbar">
    <h2>Metadata Inventory</h2>
    <div>
      <select id="apiVersionSelect">
        <option value="65.0">v65.0</option>
        <option value="64.0">v64.0</option>
        <option value="63.0">v63.0</option>
      </select>
      <a href="./index.html"><button>Back</button></a>
      <button id="scanBtn">Scan</button>
      <button id="csvBtn">CSV</button>
      <button id="jsonBtn">JSON</button>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Type</th><th>API Name</th><th>Last Modified</th><th>User</th><th>Id</th>
      </tr>
    </thead>
    <tbody id="tbody">
      <tr><td colspan="5">Not scanned.</td></tr>
    </tbody>
  </table>

  <pre id="log" style="margin-top:14px;">Ready.</pre>
</div>

<script src="./inventory.js"></script>
</body>
</html>
